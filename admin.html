<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Espace propriétaire — MIRACLE</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#5E2A38" />
  <link rel="icon" href="assets/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <div class="login" id="login" hidden>
    <form class="login__card" id="login-form">
      <img class="login__logo" src="assets/logo.jpg" alt="MIRACLE" />
      <p class="login__eyebrow">Espace propriétaire</p>
      <h1 class="login__title">Tableau de bord MIRACLE</h1>
      <label class="a-label" for="login-user">Nom d'utilisateur</label>
      <input class="a-input" type="text" id="login-user" autocomplete="username" required autofocus style="margin-bottom:1rem" />
      <label class="a-label" for="login-pw">Mot de passe</label>
      <input class="a-input" type="password" id="login-pw" autocomplete="current-password" required />
      <button class="a-btn a-btn--block" type="submit" id="login-btn">Se connecter</button>
      <p class="login__msg" id="login-msg" role="alert"></p>
      <a class="login__back" href="index.html">← Retour à la boutique</a>
    </form>
  </div>

  <!-- ============ APP ============ -->
  <div class="app" id="app" hidden>
    <div class="side-scrim" id="side-scrim"></div>
    <aside class="side" id="side">
      <a class="side__brand" href="index.html" target="_blank" rel="noopener">
        <img src="assets/logo.jpg" alt="MIRACLE" />
      </a>
      <p class="side__eyebrow">Espace propriétaire</p>
      <nav class="side__nav" id="side-nav" aria-label="Sections du tableau de bord"></nav>
      <div class="side__foot">
        <a class="side__link" href="index.html" target="_blank" rel="noopener">Voir la boutique ↗</a>
        <button class="side__link side__link--out" id="logout-btn" type="button">Se déconnecter</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="topbar__burger" id="side-open" aria-label="Menu" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg>
        </button>
        <h1 class="topbar__title" id="page-title">Tableau de bord</h1>
        <div class="topbar__side">
          <button class="a-btn a-btn--ghost a-btn--sm" id="refresh-btn" type="button">Actualiser</button>
        </div>
      </header>
      <main class="view" id="view" aria-live="polite"></main>
    </div>
  </div>

  <div class="a-toasts" id="toasts"></div>

  <script src="js/admin/app.js"></script>
  <script src="js/admin/dashboard.js"></script>
  <script src="js/admin/commandes.js"></script>
  <script src="js/admin/produits.js"></script>
  <script src="js/admin/livraison.js"></script>
  <script src="js/admin/journal.js"></script>
  <script src="js/admin/parametres.js"></script>
</body>
</html>
